    if(col + 2 + it.rawLen >= COLS && (col>0 || COLS===64)){ s=s.replace(/ +$/,'')+'\n'; col=0; }
    const t=it.text+'. ';
    s+=t;
    const nl=t.lastIndexOf('\n');
    col = nl>=0 ? t.length-nl-1 : (col+t.length)%COLS;
  }
  return s.replace(/ +$/,'');
}

const isDark  = ()=> (S.bits & (1<<DARKBIT)) &&
                     S.itemLoc[LIGHT_SOURCE]!==CARRIED &&
                     S.itemLoc[LIGHT_SOURCE]!==S.loc;

/* ---------- room display (top pane) ---------- */
function look(){
  if(isDark()){ setText(elRoom, 'Its too dark to see!', true); return; }
  const r = G.rooms[S.loc];
  let s = r.text.startsWith('*') ? r.text.slice(1) : 'I am in a '+r.text;
  /* 7A65: ". Visible items:" is printed in front of the FIRST item found, so a
     room with nothing in it gets neither the full stop nor the heading.
     7A91: likewise the exits heading is printed in front of the first exit,
     so a room with no exits has no exits line at all. */
  const here=[];
  for(let k=0;k<G.items.length;k++) if(S.itemLoc[k]===S.loc) here.push(k);
  if(here.length) s += '. Visible items:\n\n' + itemRun(here);
  s += '\n';
  const names=['NORTH','SOUTH','EAST','WEST','UP','DOWN'];
  const ex = r.exits.map((v,k)=>v?names[k]:null).filter(Boolean);
  if(ex.length) s += '\n     Some obvious exits are: ' + ex.join(' ');
  setText(elRoom, s.replace(/\n+$/,''), true);
}

/* On a touch device the soft keyboard eats half the screen, so it is not
   raised until the player asks for it - either by tapping the prompt or by
   tapping Keyboard. Once it is up we keep it up, by refocusing the fresh
   input each turn. On a desktop the input is always focused, as before. */
const TOUCH = HAS_DOM && window.matchMedia &&
              window.matchMedia('(pointer:coarse)').matches;
let kbUp = !TOUCH;

function submit(txt){
  const line = document.getElementById('inline');
  if(!line) return;
  const inp = line.querySelector('input');
  if(inp && document.activeElement === inp) kbUp = true;
  line.remove();
  echo('  -------> Tell me what to do? ' + txt);
  handle(txt);
}

function prompt_(){
  document.getElementById('inline')?.remove();
  const line=document.createElement('div');
  line.id='inline';
  line.innerHTML='<span>  -------&gt; Tell me what to do? </span>';
  const inp=document.createElement('input');
  inp.id='cmd'; inp.autocomplete='off'; inp.spellcheck=false;
  inp.autocapitalize='characters'; inp.enterKeyHint='go';
  line.appendChild(inp);
  elLog.appendChild(line);
  if(kbUp) inp.focus();
  inp.addEventListener('focus', ()=>{ kbUp=true; scrollLog(); });
  elLog.scrollTop = elLog.scrollHeight;
  inp.addEventListener('keydown', e=>{
    if(e.key!=='Enter') return;
    submit(inp.value);
  });
}
function scrollLog(){
  elLog.scrollTop = elLog.scrollHeight;
  if(HAS_DOM) setTimeout(()=>{ elLog.scrollTop = elLog.scrollHeight; }, 120);
}

/* ---------- vocabulary matching ---------- */
/* 753A compares the first wordLen characters of what was typed against the
   first wordLen characters of each entry, zero padding included - an exact
   match, not a prefix. "INV" is INVENTORY in a 3-letter game; "IN" is not.
   Prefix matching looks friendlier but silently picks the wrong word whenever
   a short word is the start of an earlier long one: GUN became GUNPOWDER in
   Ghost Town, IN became INVENTORY in three games, and a bare I meant LIGHT in
   Adventureland. A match on a synonym (*WORD) walks back to its owner (7556). */
function whichWord(word, list){
  if(!word) return -1;
  const w = word.toUpperCase().slice(0, G.wordLen);
  let owner = -1;
  for(let k=0;k<list.length;k++){
    let e = list[k];
    if(!e) continue;
    if(e[0]==='*'){ e = e.slice(1); } else { owner = k; }
    if(e.toUpperCase().slice(0, G.wordLen) === w) return owner<0?k:owner;
  }
  return -1;
}
function matchItem(word, where){
  if(!word) return -1;
  const raw = word.toUpperCase();
  const L = Math.min(raw.length, G.wordLen);
  const w = raw.slice(0,L);
  for(let k=0;k<G.items.length;k++){
    const it=G.items[k];
    if(it.word && S.itemLoc[k]===where && it.word.toUpperCase().slice(0,L)===w) return k;
  }
  return -1;
}

/* ---------- the engine ---------- */
/* nounText is what SAYw (84/85) prints: the interpreter's word buffer at 8BF0.
   After the noun lookup, 7567 overwrites the first wordLen bytes of that
   buffer with the vocabulary's own spelling of the word (the owner, if a
   synonym was typed), so that is what gets printed and what the built-in
   GET/DROP compares against - not the raw keystrokes. */
let nounText = '';

/* Scott Adams left his debugging switches in the shipped interpreter (75FA).
   A lower-case p at the prompt turns on a trace of every action line whose
   verb and noun matched ("PSBL: 61") and every line that actually ran
   ("DID: 12"); a lower-case t shows only the lines that ran; a capital X turns
   it off. The numbers are action-table line numbers, the same ones
   tools/decode.py prints, so the two machines can be compared line by line. */
let DEBUG = 0;

/* Returns  0  a line ran (or GET/DROP dealt with it)
           -1  nothing in the table matched the verb and noun   (8C30 still set)
           -2  something matched but the LAST match failed its conditions (8C32 clear)
   This is ADV/CMD 7C71-7E1C. Player nouns use the original's convention:
   0 means "no noun typed". */
function performActions(vb, no){
  let matched=false, lastOK=true, again=false;
  const finish = ()=>{
    /* 7CA3: end of a player command */
    if(vb===0) return 0;
    if(!matched && (vb===10 || vb===18)){ builtinGetDrop(vb, no); return 0; }
    return !matched ? -1 : (lastOK ? 0 : -2);
  };
  for(let ct=0; ct<G.actions.length; ct++){
    const A = G.actions[ct];
    const vv = Math.floor(A.vocab/150), nv = A.vocab%150;
    /* 7CD8-7CE2: the automatic pass ends at the first line that has a verb.
       Automatic lines therefore only work at the top of the table, ahead of
       every command - which is where all sixteen games keep them. */
    if(vb===0 && vv!==0) return 0;
    let chained=false;
    if(again){
      if(A.vocab===0) chained=true;          /* 7CE9: a 0/0 line continues the chain */
      else if(vb!==0) return 0;              /* 7CF5: chain over, and so is the command - no messages */
      else again=false;                      /* 7CFA: on to the next automatic line */
    }
    if(!chained){
      if(vv!==vb) continue;                  /* 7CFD */
      if(vb===0){
        /* 7D06: a verb-0 line is rolled against its percentage. A percentage
           of 0 can never win the roll, which is what makes 0/0 lines reachable
           only through CONT. */
        if(nv===0 || !rollPercent(nv)) continue;
      }else{
        if(nv!==no && nv!==0) continue;      /* 7D1C */
        if(DEBUG===1) out('PSBL: '+ct+' ');  /* 7D29 */
      }
    }
    matched=true; lastOK=true;               /* 7D3A */

    /* conditions */
    const par=[]; let ok=true;
    for(const c of A.cond){
      const op = c%20, dv = Math.floor(c/20);
      switch(op){
        case 0: par.push(dv); break;
        case 1: if(S.itemLoc[dv]!==CARRIED) ok=false; break;
        case 2: if(S.itemLoc[dv]!==S.loc) ok=false; break;
        case 3: if(S.itemLoc[dv]!==CARRIED && S.itemLoc[dv]!==S.loc) ok=false; break;
        case 4: if(S.loc!==dv) ok=false; break;
        case 5: if(S.itemLoc[dv]===S.loc) ok=false; break;
        case 6: if(S.itemLoc[dv]===CARRIED) ok=false; break;
        case 7: if(S.loc===dv) ok=false; break;
        case 8: if(!(S.bits & (1<<dv))) ok=false; break;
        case 9: if(S.bits & (1<<dv)) ok=false; break;
        case 10: if(carried()===0) ok=false; break;
        case 11: if(carried()!==0) ok=false; break;
        case 12: if(S.itemLoc[dv]===CARRIED || S.itemLoc[dv]===S.loc) ok=false; break;
        case 13: if(S.itemLoc[dv]===0) ok=false; break;
        case 14: if(S.itemLoc[dv]!==0) ok=false; break;
        case 15: if(S.counter > dv) ok=false; break;
        case 16: if(S.counter <= dv) ok=false; break;
        case 17: if(S.itemLoc[dv]!==G.items[dv].initLoc) ok=false; break;
        case 18: if(S.itemLoc[dv]===G.items[dv].initLoc) ok=false; break;
        case 19: if(S.counter !== dv) ok=false; break;
      }
      if(!ok) break;
    }
    if(!ok){ lastOK=false; continue; }       /* 7D8E */
    if(DEBUG) out('DID: '+ct+' ');           /* 7D95 */

    /* actions: two ints pack four codes */
    const codes=[Math.floor(A.act[0]/150), A.act[0]%150,
                 Math.floor(A.act[1]/150), A.act[1]%150];
    /* NB: `again` is deliberately NOT cleared here. Once a line runs CONT the
       chain continues through ALL following vocab-0 lines, whether or not each
       of them repeats the CONT. Strange Odyssey's whole startup block - which
       fills the air tank - hangs off one CONT on line 5. */
    let p=0;
    codes: for(const c of codes){
      if(c===0) continue;
      if(c>=1 && c<=51){ out(G.messages[c]+'\n'); continue; }
      if(c>=102){ out(G.messages[c-50]+'\n'); continue; }
      switch(c){
        case 52: /* 813E: over the limit, the original POPs its way out of the
                    action list - the REST OF THIS LINE is abandoned, not just
                    the GET. Carrying on would run the line's other effects
                    for a pick-up that never happened. */
                 if(carried()>=G.maxCarry){ out("I'm carrying too much. Try: TAKE INVENTORY\n"); break codes; }
                 S.itemLoc[par[p++]]=CARRIED; break;
        case 53: S.itemLoc[par[p++]]=S.loc; break;
        case 54: S.loc=par[p++]; break;
        case 55: case 59: S.itemLoc[par[p++]]=0; break;
        case 56: S.bits |= (1<<DARKBIT); break;
        case 57: S.bits &= ~(1<<DARKBIT); break;
        case 58: S.bits |= (1<<par[p++]); break;
        case 60: S.bits &= ~(1<<par[p++]); break;
        case 61: out("I'm DEAD!\n"); S.bits &= ~(1<<DARKBIT); S.loc=G.nRooms; break;
        case 62: { const it=par[p++], rm=par[p++]; S.itemLoc[it]=rm; } break;
        case 63: /* 8295: the original stops here and waits for Y or N. Nothing
                    after FINI runs - not the rest of the line, not the rest of
                    the automatic pass. */
                 out("The Adventure is over.\n"); over=true; return 0;
        case 64: case 76: break;
        case 65: doScore(); if(over) return 0; break;
        case 66: doInventory(); break;
        case 67: S.bits |= 1; break;
        case 68: S.bits &= ~1; break;
        case 69: S.lightTime=G.lightTime; S.itemLoc[LIGHT_SOURCE]=CARRIED; S.bits &= ~(1<<LIGHTOUT); break;
        case 70: break;   /* 83FD is a bare RET: in this interpreter CLS does nothing */
        case 71: out("Use the 'Save to file' button below.\n"); break;
        case 72: { const a=par[p++], b=par[p++]; const t=S.itemLoc[a]; S.itemLoc[a]=S.itemLoc[b]; S.itemLoc[b]=t; } break;
        case 73: again=true; break;
        case 74: S.itemLoc[par[p++]]=CARRIED; break;
        case 75: { const a=par[p++], b=par[p++]; S.itemLoc[a]=S.itemLoc[b]; } break;
        case 77: S.counter--; break;              /* 81BD: no floor - it goes on down past -1 */
        case 78: out(String(S.counter)+' '); break;
        case 79: S.counter=par[p++]; break;
        case 80: { const t=S.loc; S.loc=S.savedRoom; S.savedRoom=t; } break;
        case 81: { const k=par[p++]; const t=S.counter;
                   /* 81E7: the eight counters sit directly below the light
                      timer, so slot 8 IS the light timer */
                   if(k===8){ S.counter=S.lightTime; S.lightTime=t; }
                   else { S.counter=S.counters[k]; S.counters[k]=t; } } break;
        case 82: S.counter += par[p++]; break;
        case 83: S.counter -= par[p++]; break;    /* 8213: no floor here either */
        case 84: out(nounText); break;
        case 85: out(nounText+'\n'); break;
        case 86: out('\n'); break;
        case 87: { const k=par[p++]; const t=S.loc;
                   /* 823E: slot 0 is the same byte EXRM0 (80) uses */
                   if(k===0){ S.loc=S.savedRoom; S.savedRoom=t; }
                   else { S.loc=S.roomSaved[k]; S.roomSaved[k]=t; } } break;
        case 88: break;
      }
    }
    if(again) continue;                      /* 7E0E */
    if(vb!==0) break;                        /* 7E15: one line per command unless it chains */
  }
  return finish();
}

/* The built-in GET / DROP, ADV/CMD 7E84-7F71. It is reached ONLY when no line
   in the table matched the verb and noun at all (7E8E tests 8C33, which 7D41
   sets the moment a line matches - before its conditions are looked at). So
   if the table has a GET LAMP line and its conditions fail, the answer is
   "I can't do that...yet!" and the lamp stays where it is; it does not fall
   through to an automatic pick-up.

   The noun is compared in the vocabulary's own spelling (see nounText), which
   is why GET RUM picks up the bottle in Pirate Adventure: RUM is a synonym of
   BOT, and the bottle is /BOT/. The item's word has to be that word exactly.

   It scans every matching item, remembers why each one failed, and reports
   the last reason:
       1  I'm not carrying it!      DROP something you haven't got
       2  I don't see it here.      GET something that exists elsewhere
       4  I already have it.        GET something already carried
       0  Its beyond my power...    no item anywhere has that word            */
function builtinGetDrop(vb, no){
  if(no===0){ out('HUH?\n'); return; }                         /* 7E93 */
  if(vb===10 && carried()>=G.maxCarry){                        /* 7EA2 */
    out("I'm carrying too much. Try: TAKE INVENTORY\n"); return; }
  const w = (G.nouns[no]||'').replace(/^\*/,'').toUpperCase().slice(0, G.wordLen);
  let err = 0;
  for(let k=0;k<G.items.length;k++){
    const it = G.items[k];
    if(!it.word || it.word.toUpperCase() !== w) continue;
    const loc = S.itemLoc[k];
    if(vb===10){
      if(loc===CARRIED){ err=4; continue; }
      if(loc!==S.loc){ err=2; continue; }
      S.itemLoc[k]=CARRIED; out('OK\n'); return;
    }else{
      if(loc!==CARRIED){ err=1; continue; }
      S.itemLoc[k]=S.loc; out('OK\n'); return;
    }
  }
  out(err===1 ? "I'm not carrying it!\n" :
      err===2 ? "\nI don't see it here.\n" :
      err===4 ? 'I already have it.\n'  :
                '\nIts beyond my power to do that.\n');
}

function doScore(){
  let n=0;
  G.items.forEach((it,k)=>{ if(it.text.startsWith('*') && S.itemLoc[k]===G.treasureRoom) n++; });
  if(G.treasures>0){
    out('I stored '+n+' TREASURES.  On a scale of 0 to 100 that rates: '+
        Math.floor(n*100/G.treasures)+'\n');
    if(n===G.treasures){ out("FANTASTIC! You've solved it ALL!\n"); over=true; }   /* 83B5 */
  }else{
    /* several of these games are not treasure hunts - they finish on an
       action instead, so there is no percentage to report */
    out('I stored '+n+' TREASURES.\n');
  }
}
function doInventory(){
  const l=[];
  for(let k=0;k<G.items.length;k++) if(S.itemLoc[k]===CARRIED) l.push(k);
  out('\nI am carrying the following:\n' + (l.length ? itemRun(l) : 'Nothing At All') + '\n');
}

/* ---------- HELP ME : hints derived from the action table ----------
   No hand-written hints. The engine already knows every rule of the game, so
   the hint system asks it questions:

     which lines would fire right now?          -> "something here responds to X"
     which lines fail by exactly one condition? -> "you would need the crowbar"
     which exits have I never walked?           -> "you have not gone west yet"

   Typing HELP ME again in the same room escalates: nudge, then what you are
   missing, then the actual command. Moving resets it.

   The condition test below duplicates the one in performActions on purpose -
   help must never be able to change game state. Keep the two in step.       */

const HELP_STATEFUL = new Set([52,53,54,55,58,59,60,61,62,63,69,72,74,75,79,80,81,82,83,87]);
const HELP_SKIPVERB = new Set(['SCO','INV','QUI','HEL','LOO','SAV','SAY','REA','EXA']);

function helpCondFails(A){
  const fails=[];
  for(const c of A.cond){
    const op=c%20, dv=Math.floor(c/20);
    if(op===0) continue;
    let ok=true;
    switch(op){
      case 1:  ok = S.itemLoc[dv]===CARRIED; break;
      case 2:  ok = S.itemLoc[dv]===S.loc; break;
      case 3:  ok = S.itemLoc[dv]===CARRIED||S.itemLoc[dv]===S.loc; break;
      case 4:  ok = S.loc===dv; break;
      case 5:  ok = S.itemLoc[dv]!==S.loc; break;
      case 6:  ok = S.itemLoc[dv]!==CARRIED; break;
      case 7:  ok = S.loc!==dv; break;
      case 8:  ok = !!(S.bits&(1<<dv)); break;
      case 9:  ok = !(S.bits&(1<<dv)); break;
      case 10: ok = carried()>0; break;
      case 11: ok = carried()===0; break;
      case 12: ok = !(S.itemLoc[dv]===CARRIED||S.itemLoc[dv]===S.loc); break;
      case 13: ok = S.itemLoc[dv]!==0; break;
      case 14: ok = S.itemLoc[dv]===0; break;
      case 15: ok = S.counter<=dv; break;
      case 16: ok = S.counter>dv; break;
      case 17: ok = S.itemLoc[dv]===G.items[dv].initLoc; break;
      case 18: ok = S.itemLoc[dv]!==G.items[dv].initLoc; break;
      case 19: ok = S.counter===dv; break;
    }
    if(!ok) fails.push([op,dv]);
  }
  return fails;
}
function helpDoes(A){
  const codes=[Math.floor(A.act[0]/150),A.act[0]%150,
               Math.floor(A.act[1]/150),A.act[1]%150];
  return codes.some(c=>HELP_STATEFUL.has(c));
}
function helpItemName(i){
  const it=G.items[i];
  if(!it) return 'something';
  const t=it.text.replace(/^\*/,'').replace(/\*$/,'').trim();
  return t ? (t.length>34?t.slice(0,33)+'…':t) : 'something';
}
function helpRoomName(r){
  if(!S.seen[r]) return null;
  const t=G.rooms[r].text.replace(/^\*/,'').replace(/^I am (in|at|on) (a |an |the )?/i,'')
          .replace(/\n/g,' ').split(/[.,]/)[0].trim();
  return t.length>34?t.slice(0,33)+'…':t;
}
function helpCmdOf(A){
  const vb=Math.floor(A.vocab/150), nn=A.vocab%150;
  const v=(G.verbs[vb]||'').replace(/^\*/,'');
  const n=nn?(G.nouns[nn]||'').replace(/^\*/,''):'';
  return {v,n,txt:(v+(n?' '+n:'')).toUpperCase()};
}
function helpNeed(op,dv){
  switch(op){
    case 1:  return 'you were carrying the '+helpItemName(dv);
    case 2:  return 'the '+helpItemName(dv)+' were here';
    case 3:  return 'the '+helpItemName(dv)+' were here or in your hands';
    case 4:  { const r=helpRoomName(dv); return r?('you were at the '+r):'you were somewhere else'; }
    case 5:  return 'the '+helpItemName(dv)+' were not here';
    case 6:  return 'you were not carrying the '+helpItemName(dv);
    case 7:  return 'you were somewhere else';
    case 8:  return 'something else had happened first';
    case 9:  return 'something else had not happened yet';
    case 10: return 'you were carrying anything at all';
    case 11: return 'your hands were empty';
    case 12: return 'the '+helpItemName(dv)+' were out of reach';
    case 13: return 'the '+helpItemName(dv)+' existed yet';
    case 14: return 'the '+helpItemName(dv)+' were gone';
    case 15: case 16: case 19: return 'the timing were different';
    case 17: return 'the '+helpItemName(dv)+' were back where it started';
    case 18: return 'the '+helpItemName(dv)+' had been moved';
  }
  return 'something were different';
}

function helpMe(){
  if(over){ echo('The game is over. Restart to play again.'); return; }
  if(!S.help || S.help.at!==S.loc) S.help={at:S.loc, level:1};
  else S.help.level=Math.min(3,S.help.level+1);
  const lvl=S.help.level;
  const say=t=>echo(wrap(t));

  if(isDark()){
    say('It is too dark to make anything out. Find a light and turn it on.');
    return;
  }

  /* what would fire right now, and what is one step away */
  const now=[], near=[];
  for(const A of G.actions){
    /* skip every automatic line, not just the continuations: an auto with a
       percentage has vocab = 0*150 + pct, which is not zero */
    if(Math.floor(A.vocab/150)===0) continue;
    if(!helpDoes(A)) continue;
    const c=helpCmdOf(A);
    if(HELP_SKIPVERB.has(c.v.toUpperCase().slice(0,3))) continue;
    { const hv=Math.floor(A.vocab/150); if((hv===10||hv===18) && A.vocab%150===0) continue; }
    const f=helpCondFails(A);
    /* Is this line about HERE? Either it names this room, or it needs an
       object that is in this room. Without that test, "you would need the
       crowbar" surfaces at every location in the game, because lighting a
       torch has no room condition and so is always one step away. */
    let anchored=false;
    for(const cc of A.cond){
      const o=cc%20, v=Math.floor(cc/20);
      if(o===4 && v===S.loc) anchored=true;
      if((o===2||o===3) && S.itemLoc[v]===S.loc) anchored=true;
    }
    if(f.length===0){ now.push(c); continue; }
    if(f.length!==1) continue;
    const [op,dv]=f[0];
    if(op===4||op===7) continue;   /* "if you were somewhere else" is not a clue */
    near.push({c, need:helpNeed(op,dv), anchored});
  }
  const uniq=(arr,k)=>{const s=new Set(),o=[];for(const x of arr){const v=k(x);
    if(!s.has(v)){s.add(v);o.push(x);}}return o;};
  const nowU =uniq(now, x=>x.txt).slice(0,4);
  const anchoredNear = near.filter(x=>x.anchored);
  const nearU=uniq(anchoredNear.length?anchoredNear:near, x=>x.need).slice(0,3);

  /* progress */
  if(G.treasures>0){
    const n=G.items.filter((it,k)=>it.text.startsWith('*')&&S.itemLoc[k]===G.treasureRoom).length;
    const held=G.items.filter((it,k)=>it.text.startsWith('*')&&S.itemLoc[k]===CARRIED).length;
    const where=helpRoomName(G.treasureRoom);
    say(`You have stored ${n} of ${G.treasures}.`
        + (held?` You are carrying ${held} more.`:'')
        + (where?` They go in the ${where}.`:''));
  }

  /* Unwalked exits, nearest first: the room you are in, then anywhere seen.
     An exit that leads back to the room you are standing in is not somewhere
     to go, and must never be offered as one - Strange Odyssey's methane storm
     room has all four compass exits pointing at itself, so it advertises
     NORTH SOUTH EAST WEST and every one of them is a lie. Saying "you have not
     yet tried NORTH" there sends the player round a maze that has no walking
     exit at all; the way out is a verb. */
  const LONG=['NORTH','SOUTH','EAST','WEST','UP','DOWN'];
  const hereTodo=[], hereLoop=[]; let hereReal=0;
  for(let d=0;d<6;d++){
    const t=G.rooms[S.loc].exits[d];
    if(!t) continue;
    if(t===S.loc){ hereLoop.push(LONG[d]); continue; }
    hereReal++;
    if(!S.link[S.loc+'>'+t]) hereTodo.push(LONG[d]);
  }
  const elseTodo=[];
  for(const r of Object.keys(S.seen).map(Number)){
    if(r===S.loc) continue;
    for(let d=0;d<6;d++){
      const t=G.rooms[r].exits[d];
      if(t && t!==r && !S.link[r+'>'+t]){ const nmr=helpRoomName(r);
        if(nmr) elseTodo.push(['N','S','E','W','UP','DOWN'][d]+' from the '+nmr); }
    }
  }
  if(hereTodo.length) say('From here you have not yet tried: '+hereTodo.join(', ')+'.');
  else if(!hereReal && hereLoop.length)
    say('Every direction here leads straight back to this room. Walking will '
       +'not get you out - look for something to do instead.');
  else if(hereLoop.length && !hereTodo.length)
    say('These lead back to this room: '+hereLoop.join(', ')+'.');
  else if(elseTodo.length) say('Still unexplored: '+uniq(elseTodo,x=>x).slice(0,3).join('; ')+'.');

  /* graduated nudges */
  if(lvl===1){
    if(nowU.length) say(`Something here will respond to ${nowU.length} thing`
        + (nowU.length>1?'s':'') + ' you have not tried. Ask again for a clue.');
    else if(nearU.length) say('Nothing here works yet. Ask again to hear what is missing.');
    else say('Nothing here reacts. Try somewhere else, or look at what you carry.');
    return;
  }
  if(lvl===2){
    if(nowU.length){
      say('There is something here that works. Ask once more for the words.');
      return;
    }
    if(nearU.length){
      say('Close, but not yet:');
      nearU.forEach(x=>echo(wrap('   - something would work here if '+x.need+'.')));
    }else say('Nothing here is close. The answer is elsewhere.');
    return;
  }
  if(nowU.length){
    say('Try:');
    nowU.forEach(x=>{
      const item=G.items.find(it=>it.word&&it.word.toUpperCase().slice(0,3)===x.n.slice(0,3));
      echo(wrap('   '+x.txt+(item?'      ('+helpItemName(G.items.indexOf(item))+')':'')));
    });
  }else if(nearU.length){
    say('Nothing here works yet. It would work if '+nearU[0].need+'.');
  }else{
    say('There is nothing to do here. Go somewhere else.');
  }
}

/* The light countdown, ADV/CMD 757C-75B5.

       757C  item 9 nowhere (location 0)?  -> do nothing at all
       7586  light time = light time - 1   (16 bits)
       758D  high byte not zero?           -> return
       7595  low byte 128..255?            -> return
       7596  zero: set flag 16, print "Light has run out"
       75A0  under 25: "Light runs out in N  turns"

   Three things here are easy to get wrong, and ScottFree's "prehistoric lamp"
   option gets all three wrong for these games:

   1. The lamp is NOT destroyed. The interpreter only raises flag 16; what
      happens next is the game's business. Adventureland swaps the lit lamp for
      an Empty lamp you can refill with oil; Pirate Adventure leaves a Burnt
      out torch; The Count and Mystery Fun House do nothing at all, so their
      light simply never fails. Destroying item 9 here left Adventureland with
      no lamp to refill.
   2. The messages are printed wherever the lamp is - in your hands, in the
      room, or three rooms away.
   3. The number printer leaves a space after the number and " turns" brings
      its own, hence the two spaces.                                           */
function lightTick(){
  if(S.itemLoc[LIGHT_SOURCE]===0) return;
  const t = (S.lightTime-1) & 0xFFFF;
  S.lightTime = t;
  if(t>>8 || (t&0x80)) return;
  if(t===0){ S.bits |= (1<<LIGHTOUT); out('Light has run out\n'); return; }
  if(t<25) out('Light runs out in '+t+'  turns\n');
}

/* ---------- turn ---------- */
function handle(line){
  if(over){ prompt_(); return; }
  const words = line.trim().split(/\s+/).filter(Boolean);
  if(words.length===1 && /^MAP$/i.test(words[0])){ toggleMap(); prompt_(); return; }
  if(/^(HELP\s+ME|HINT)$/i.test(line.trim())){ helpMe(); prompt_(); return; }
  const startLoc = S.loc; compassMove=false;
  if(!words.length){ flush(); prompt_(); return; }

  /* The parser, ADV/CMD 75E4-76B0.
       - a first word of ONE letter is special-cased before any vocabulary
         lookup: N S E W U D are GO in that direction (7627), and I is
         rewritten to INVE and then looked up like any other verb (7611)
       - otherwise word one must be a verb and word two, if there is one, a
         noun, each matched exactly on its first wordLen letters
       - the complaints come in the original's order: unknown verb, unknown
         noun, and only then "Use no more than 2 words"
     0 is "no noun", as it is on the real machine. */
  let vb, no = 0;
  nounText = '';
  const w0 = words[0].toUpperCase();
  if(words[0]==='X' || words[0]==='p' || words[0]==='t'){
    /* 7601-760F: the debug switches. They return to the turn loop with the
       verb still 0 from the last automatic pass, so the "command" that runs
       is one more automatic pass - the turn is not free. */
    DEBUG = words[0]==='X' ? 0 : words[0]==='p' ? 1 : 2;
    vb = 0;
  }else if(w0.length===1 && 'NSEWUD'.includes(w0)){
    vb = 1; no = 'NSEWUD'.indexOf(w0)+1;
  }else{
    const first = (w0==='I') ? 'INVE' : w0;
    vb = whichWord(first, G.verbs);
    if(vb<0){
      /* Not in the original: a direction spelled out on its own ("NORTH").
         The real interpreter only knows N, or GO NORTH. Kept because the
         touch keypad and long habit both rely on it, and no game on these
         disks has a verb that collides with a direction. */
      const d = words.length===1 ? whichWord(w0, G.nouns) : -1;
      if(d>=1 && d<=6){ vb = 1; no = d; }
      else{ echo("I don't know how to \"" + first + "\" something"); prompt_(); return; }
    }else if(words.length>1){
      no = whichWord(words[1], G.nouns);
      if(no<0){ echo("I don't know what \"" + words[1].toUpperCase() + "\" is"); prompt_(); return; }
      const canon = (G.nouns[no]||'').replace(/^\*/,'').toUpperCase().slice(0, G.wordLen);
      nounText = canon.length>=G.wordLen ? canon + words[1].toUpperCase().slice(G.wordLen) : canon;
      if(words.length>2){ echo('Use no more than 2 words'); prompt_(); return; }
    }
  }

  /* movement is hard-wired, ADV/CMD 7FED. Note the OK: the original
     acknowledges every successful move. */
  if(vb===0){
    performActions(0,0);
  }else if(vb===1 && no<7){
    const dark = isDark();
    if(dark) out('Its dangerous to move in the dark!\n');
    if(no===0) out('I need a direction too\n\n');
    else{
      const nl = G.rooms[S.loc].exits[no-1];
      if(nl){ recordEdge(S.loc, no-1, nl); S.loc = nl; out('OK\n'); }
      else if(dark){ out("I fell & broke my neck! I'm DEAD!\n"); S.loc=G.nRooms; S.bits&=~(1<<DARKBIT); }
      else out("I can't go in THAT direction\n");
    }
  }else{
    const r = performActions(vb, no);
    if(r===-1) out("\nI must be stupid, but I just don't understand what you mean.\n");
    else if(r===-2) out("\nI can't do that...yet!\n");
  }

  /* The turn loop, 7080-708A: command, THEN the light, THEN the automatic
     pass. The order matters - the light-out flag has to be up before the
     automatic lines that react to it get their turn. */
  if(!over) lightTick();
  if(!over) performActions(0,0);

  if(S.loc!==startLoc) { if(S.help) S.help=null; }
  if(S.loc!==startLoc && !compassMove) recordSpecial(startLoc, S.loc, line);
  S.seen[S.loc]=1;
  recordSight();
  autosave();
  if(mapOn) drawMap();
  flush();
  look();
  if(over){ echo(''); echo('--- press Restart to play again ---'); return; }
  prompt_();
}

/* ---------- buttons ---------- */
/* ---------- saving ----------
   Save and Load share one File-System-Access id, which is what makes the
   browser open BOTH dialogs in the same folder - pick a folder once and it
   stays picked. Browsers without that API fall back to a download plus a
   file box, which cannot be pointed anywhere, so we also autosave into the
   browser every turn and offer Resume. */
const FS_ID='adventure-saves';
const gameKey = ()=> (document.title||'adventure')+'#'+(G?G.advNum:'x');
const autoKey = ()=> 'adv-auto-'+gameKey();
const saveText = ()=> JSON.stringify({game:gameKey(), adv:G.advNum, state:S}, null, 1);
const saveName = ()=> (document.title||'adventure').toLowerCase()
                        .replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,'')+'.save.json';
function applySave(txt){
  try{
    const j=JSON.parse(txt);
    if(j.game!==undefined && j.game!==gameKey()){ echo('That save belongs to '+j.game+'.'); prompt_(); return; }
    if(j.game===undefined && j.adv!==undefined && G && j.adv!==G.advNum){
      echo('That save is for a different game.'); prompt_(); return; }
    S=j.state; mapState(); over=false; mapReset(); toggleMap(false);
    elLog.innerHTML=''; echo('Game restored.'); look(); prompt_();
  }catch(err){ echo('BAD SAVE FILE'); prompt_(); }
}
async function doSave(){
  const data=saveText();
  if(window.showSaveFilePicker){
    try{
      const h=await showSaveFilePicker({ id:FS_ID, suggestedName:saveName(),
        types:[{description:'Adventure save', accept:{'application/json':['.json']}}] });
      const w=await h.createWritable(); await w.write(data); await w.close();
      echo('Saved as '+h.name+'.'); prompt_(); return;
    }catch(err){ if(err && err.name==='AbortError'){ return; } }
  }
  const a=document.createElement('a');
  a.href=URL.createObjectURL(new Blob([data],{type:'application/json'}));
  a.download=saveName(); a.click();
  echo('Saved to your browser download folder as '+saveName()+'.'); prompt_();
}
async function doLoad(){
  if(window.showOpenFilePicker){
    try{
      const [h]=await showOpenFilePicker({ id:FS_ID, multiple:false,
        types:[{description:'Adventure save', accept:{'application/json':['.json']}}] });
      applySave(await (await h.getFile()).text()); return;
    }catch(err){ if(err && err.name==='AbortError'){ return; } }
  }
  document.getElementById('fRestore').click();
}
function autosave(){ try{ localStorage.setItem(autoKey(), saveText()); }catch(e){} }
function hasAuto(){ try{ return !!localStorage.getItem(autoKey()); }catch(e){ return false; } }
function offerResume(){
  const b=document.getElementById('bResume');
  if(hasAuto()){ b.style.display=''; echo('(An earlier position was found - click Resume to pick it up.)'); echo(''); }
  else b.style.display='none';
}
document.getElementById('bMap').onclick = ()=>toggleMap();
document.getElementById('bRestart').onclick = ()=>{ newGame(G); offerResume(); };
document.getElementById('bSave').onclick = doSave;
document.getElementById('bLoad').onclick = doLoad;
document.getElementById('bResume').onclick = ()=>{
  try{ const tx=localStorage.getItem(autoKey()); if(tx) applySave(tx); }catch(e){}
};
document.getElementById('fRestore').onchange = e=>{
  const f=e.target.files[0]; if(!f) return;
  const r=new FileReader(); r.onload=()=>applySave(r.result); r.readAsText(f);
};
document.getElementById('fGame').onchange = e=>{
  const f=e.target.files[0]; if(!f) return;
  const r=new FileReader();
  r.onload=()=>{ try{ newGame(parseDatabase(r.result)); }
                 catch(err){ echo('Could not read that database: '+err.message); prompt_(); } };
  r.readAsText(f,'ISO-8859-1');
};

/* ---------- touch and small screens ---------- */
/* The keypad submits through the same path a typed line takes, so nothing
   downstream can tell the difference. pointerdown is preventDefaulted so
   tapping a key never blurs the text input: if the keyboard is already up
   it stays up, and if it is not, it does not spring open. */
if(HAS_DOM){
  const pad = document.getElementById('pad');
  pad.addEventListener('pointerdown', e=>{
    const b = e.target.closest('button[data-c]');
    if(!b) return;
    e.preventDefault();
    if(mapOn && /^(NORTH|SOUTH|EAST|WEST|UP|DOWN)$/.test(b.dataset.c)){ mapIssue(b.dataset.c[0]); mapPanel(); return; }
    if(mapOn) toggleMap(false);
    submit(b.dataset.c);
  });
  document.getElementById('bKeys').addEventListener('click', ()=>{
    if(mapOn) toggleMap(false);
    const inp = document.querySelector('#cmd');
    if(!inp) return;
    if(document.activeElement === inp){ inp.blur(); kbUp = false; }
    else { kbUp = true; inp.focus(); }
  });

  /* iOS slides the keyboard over the layout viewport rather than shrinking
     it, so 100dvh alone leaves the prompt hidden underneath the keys. Track
     the visual viewport and drive the case height from it. */
  const vv = window.visualViewport;
  const fitHeight = ()=>{
    const h = vv ? vv.height : window.innerHeight;
    document.documentElement.style.setProperty('--apph', h + 'px');
    scrollLog();
  };
  if(vv){ vv.addEventListener('resize', fitHeight); vv.addEventListener('scroll', fitHeight); }
  window.addEventListener('resize', ()=>{ fitHeight(); rewrap(); if(mapOn) drawMap(); });
  window.addEventListener('orientationchange', ()=>
    setTimeout(()=>{ fitHeight(); rewrap(); if(mapOn) drawMap(); }, 250));
  fitHeight();

  /* tapping anywhere on the transcript puts the caret back in the prompt */
  elLog.addEventListener('click', e=>{
    if(e.target.tagName === 'INPUT') return;
    if(window.getSelection && String(window.getSelection())) return;   /* copying */
    if(kbUp) document.querySelector('#cmd')?.focus();
  });

  mapInit();
}

/* ---------- boot ---------- */
/* Measure before the first word is printed. rewrap() only fires on a resize,
   and a phone that is simply opened never resizes - so without this the
   opening screen, which is the one thing every player sees, would stay
   wrapped for a 64-column terminal on a 37-column phone. */
/* Stamped by tools/rebuild.py. Shown under the screen, outside the emulated
   terminal so it cannot pollute a side-by-side comparison with the original.
   Its only job is to answer "am I actually running the build I just made?" —
   a file:// page reopened in the same browser will happily serve a cached
   copy, which looks exactly like a fix that did not work. */
const BUILD = "2026-10-18.11e51b";
if(HAS_DOM){
  const b = document.getElementById('build');
